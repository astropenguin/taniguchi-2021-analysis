[project]
name = "taniguchi-2021-analysis"
version = "1.0.0"
description = "Analysis repository for Taniguchi et al. 2021, AJ, 162, 111"
readme = "README.md"
keywords = [
    "astronomy",
    "paper",
    "methods",
    "radio-astronomy",
    "spectroscopy",
    "single-dish",
    "matrix-decomposition",
]
requires-python = ">=3.10,<3.14"
dependencies = [
    "astropy>=6,<8",
    "numpy>=2,<3",
    "pandas>=2,<3",
    "pandas-stubs>=2,<3",
    "scikit-learn>=1,<2",
    "scipy>=1,<2",
    "tqdm>=4,<5",
    "xarray>=2024,<2026",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[[project.authors]]
name = "Akio Taniguchi"
email = "taniguchi.akio@gmail.com"

[project.license]
file = "LICENSE"

[project.urls]
repository = "https://github.com/astropenguin/taniguchi-2021-analysis"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=25,<26",
    "ipython>=8,<10",
    "jupyter>=1,<2",
    "jupyter-io>=2,<3",
    "matplotlib>=3,<4",
    "netcdf4>=1,<2",
]
